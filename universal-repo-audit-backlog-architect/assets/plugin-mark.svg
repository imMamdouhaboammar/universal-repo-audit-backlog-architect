  <!-- Central Architecture Hub Node -->
  <circle cx="256" cy="256" r="44" fill="#1E293B" stroke="url(#grad1)" stroke-width="8"/>
  <path d="M244 244 L256 232 L268 244 M256 234 L256 276" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Downstream Execution Slices -->
  <circle cx="160" cy="360" r="32" fill="#1E293B" stroke="#64748B" stroke-width="5"/>
  <circle cx="256" cy="360" r="36" fill="#1E293B" stroke="url(#grad2)" stroke-width="6"/>
  <circle cx="256" cy="360" r="14" fill="#10B981"/>
  <circle cx="352" cy="360" r="32" fill="#1E293B" stroke="#64748B" stroke-width="5"/>
