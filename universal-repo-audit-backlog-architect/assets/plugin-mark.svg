<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Universal Repository Audit &amp; Backlog Architect</title>
  <desc id="desc">Square plugin mark featuring a code audit lens connected to a prioritized dependency graph.</desc>
  <rect width="512" height="512" rx="112" fill="#0F172A"/>
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <!-- Connecting DAG Edges -->
  <path d="M160 170 L256 256 M256 256 L352 170 M256 256 L256 360 M160 170 L160 360 M352 170 L352 360" stroke="#334155" stroke-width="8" stroke-dasharray="12 8" stroke-linecap="round"/>
  <path d="M160 170 L256 256 L352 360" stroke="url(#grad1)" stroke-width="6" stroke-linecap="round"/>
