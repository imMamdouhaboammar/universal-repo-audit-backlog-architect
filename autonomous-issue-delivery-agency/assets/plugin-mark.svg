<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Autonomous Issue Delivery Agency</title>
  <desc id="desc">Square plugin mark featuring an iterative delivery loop connecting issue triage, implementation, verification, and automated PR merge.</desc>
  <rect width="512" height="512" rx="112" fill="#0F172A"/>
  <defs>
    <linearGradient id="agencyGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="agencyGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
  </defs>

  <!-- Outer Orbit Track -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#1E293B" stroke-width="12" stroke-dasharray="16 10"/>

  <!-- Iterative Loop Curved Arrows -->
  <path d="M 256 96 A 160 160 0 0 1 416 256" fill="none" stroke="url(#agencyGrad1)" stroke-width="12" stroke-linecap="round"/>
  <polygon points="416,256 404,232 428,232" fill="#6366F1"/>

  <path d="M 416 256 A 160 160 0 0 1 256 416" fill="none" stroke="#6366F1" stroke-width="12" stroke-linecap="round"/>
  <polygon points="256,416 280,404 280,428" fill="#6366F1"/>

  <path d="M 256 416 A 160 160 0 0 1 96 256" fill="none" stroke="url(#agencyGrad2)" stroke-width="12" stroke-linecap="round"/>
  <polygon points="96,256 108,280 84,280" fill="#EC4899"/>

  <path d="M 96 256 A 160 160 0 0 1 256 96" fill="none" stroke="#10B981" stroke-width="12" stroke-linecap="round"/>
  <polygon points="256,96 232,108 232,84" fill="#10B981"/>

  <!-- Orbiting Phase Nodes -->
  <!-- Top Node: Issue / Intake -->
  <circle cx="256" cy="96" r="28" fill="#1E293B" stroke="#10B981" stroke-width="6"/>
  <circle cx="256" cy="96" r="12" fill="#10B981"/>

  <!-- Right Node: Implement & Verify -->
  <circle cx="416" cy="256" r="28" fill="#1E293B" stroke="#38BDF8" stroke-width="6"/>
  <circle cx="416" cy="256" r="12" fill="#38BDF8"/>

  <!-- Bottom Node: PR & Merge -->
  <circle cx="256" cy="416" r="28" fill="#1E293B" stroke="#6366F1" stroke-width="6"/>
  <circle cx="256" cy="416" r="12" fill="#6366F1"/>

  <!-- Left Node: Close & Document -->
  <circle cx="96" cy="256" r="28" fill="#1E293B" stroke="#EC4899" stroke-width="6"/>
  <circle cx="96" cy="256" r="12" fill="#EC4899"/>

  <!-- Central Hub: Autonomous Engineering Agency -->
  <circle cx="256" cy="256" r="76" fill="#1E293B" stroke="url(#agencyGrad1)" stroke-width="8"/>
  <circle cx="256" cy="256" r="60" fill="#0F172A"/>

  <!-- Central Delivery Checkmark & Git Branch Glyph -->
  <path d="M224 256 L248 280 L296 232" fill="none" stroke="#10B981" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
